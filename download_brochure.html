  <script>
    (function () {
      var lastSent = 0;
      var rafId = 0;
  
      function getStableHeight() {
        // Prefer the real Brevo container(s)
        var el =
          document.getElementById("sib-form-container") ||
          document.getElementById("sib-container") ||
          document.body;
  
        // scrollHeight handles expanded errors; offsetHeight handles normal box size
        var h = Math.max(el.scrollHeight || 0, el.offsetHeight || 0);
  
        // Add body margins? We set margin:0 so no need.
        return Math.ceil(h);
      }
  
      function postHeight() {
        var h = getStableHeight() + 3;
        if (!h || !isFinite(h)) return;
  
        // Ignore tiny changes
        if (Math.abs(h - lastSent) < 8) return;
        lastSent = h;
  
        window.parent.postMessage({ type: "BREVO_HEIGHT", height: h }, "*");
      }
  
      function schedulePost() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function () {
          postHeight();
          rafId = 0;
        });
      }
  
      // Initial + after layout settles
      if (document.readyState === "complete") schedulePost();
      else window.addEventListener("load", schedulePost);
  
      setTimeout(schedulePost, 50);
      setTimeout(schedulePost, 200);
      setTimeout(schedulePost, 600);
      setTimeout(schedulePost, 1200);
  
      // Watch just the Brevo containers/panels (success/error/inline errors)
      var targets = [
        document.getElementById("sib-form-container"),
        document.getElementById("sib-container"),
        document.getElementById("error-message"),
        document.getElementById("success-message")
      ].filter(Boolean);
  
      var mo = new MutationObserver(schedulePost);
      targets.forEach(function (t) {
        mo.observe(t, {
          subtree: true,
          childList: true,
          characterData: true,
          attributes: true,
          attributeFilter: ["style", "class", "hidden", "aria-hidden"]
        });
      });
  
      window.addEventListener("resize", schedulePost);
    })();
  </script>

  <script>
    (function () {
      // Optional: pass utm_source from iframe URL into a hidden field (if present)
      var params;      
      try {
        params = new URLSearchParams(window.location.search);
      } catch (e) {}

      var utm = params.get("utm_source") || "";
      var utmEl = document.getElementById("UTM_SOURCE");
      if (utmEl) utmEl.value = utm;

      var productName = params.get("product_name");
      if (!productName) return;

      // Basic safety: prevent HTML injection by assigning textContent
      var el = document.querySelector("[data-product-name]");
      if (el) el.textContent = productName;

      var formKey = params.get("form_key");
      if (!formKey) return;

      // 🔒 ALLOWLIST: map keys → Brevo endpoints
      var ACTION_MAP = {
        "suwannee-brochure":
          "https://4c74d77d.sibforms.com/serve/MUIFAPe7ZYzJjw8SfmEWHLnKpRWgyuVyjaDPNgl7kQzHKKeSTJpB4597lB-4SvKM7-6maHX9JYBVR7DI2lEV118KkE3mZbpeV7wWU57XHXBtl64-uBWZkjVxhrtk1kVJeI_sb9r2DU0QwPdXnctfxcHqL9UAy67L3PKWDB1nfHsNd49nvEUJ5cteV3SnDJqjBaAiN2yONZxsymNL",

        "everglades-brochure":
          "https://XXXXXXX.sibforms.com/serve/XXXXXXXXXXXX"
      };

      var action = ACTION_MAP[formKey];
      if (!action)
        action = ACTION_MAP["suwannee-brochure"];

      var form = document.getElementById("sib-form");
      if (form) {
        form.setAttribute("action", action);
      }

      var leadMagnet = (params.get("lead_magnet") || "").trim();
      if (!leadMagnet) return;

      var FIELD_ID = "LEAD_MAGNET"; // Brevo field id/name

      function findField() {
        // Try a few ways: id, name, within the Brevo form
        var form = document.getElementById("sib-form");
        if (form) {
          return (
            form.querySelector("#" + CSS.escape(FIELD_ID)) ||
            form.querySelector('input[name="' + FIELD_ID + '"]') ||
            form.querySelector('input[id="' + FIELD_ID + '"]')
          );
        }
        return (
          document.getElementById(FIELD_ID) ||
          document.querySelector('input[name="' + FIELD_ID + '"]')
        );
      }

      function setFieldValue(input, value) {
        if (!input) return false;

        // Don’t overwrite if user already typed something
        if (input.value && input.value.trim() !== "") return true;

        // Set both value and defaultValue (Brevo sometimes resets value to defaultValue)
        input.value = value;
        input.defaultValue = value;
        input.setAttribute("value", value);

        // Trigger events Brevo listens for
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        input.dispatchEvent(new Event("blur", { bubbles: true }));

        return (input.value || "").trim() === value;
      }

      // Cache email early (Brevo may wipe/replace the DOM on success)
      document.addEventListener("submit", function (e) {
        var form = e.target;
        if (!form || form.id !== "sib-form") return;

        var emailInput = form.querySelector("#EMAIL") || form.querySelector('input[name="EMAIL"]');
        if (emailInput && emailInput.value) {
          window.__BREVO_EMAIL__ = String(emailInput.value).trim();
        }
      }, true);

      // Also cache on input (extra safety)
      document.addEventListener("input", function (e) {
        var t = e.target;
        if (t && (t.id === "EMAIL" || t.name === "EMAIL")) {
          window.__BREVO_EMAIL__ = String(t.value || "").trim();
        }
      }, true);

      // Observe success panel visibility and notify parent
      var successEl = document.getElementById("success-message");
      if (!successEl) return;

      var notified = false;
      function isVisible(el) {
        var s = window.getComputedStyle(el);
        return s && s.display !== "none" && s.visibility !== "hidden" && s.opacity !== "0";
      }

      function notifyParentOnce() {
        if (notified) return;
        notified = true;
        var email = window.__BREVO_EMAIL__ || "";
        window.parent.postMessage({ type: "BREVO_SUCCESS", email: email }, "*");
      }

      // Initial check (in case success already visible)
      if (isVisible(successEl)) notifyParentOnce();

      var obs = new MutationObserver(function () {
        if (isVisible(successEl)) notifyParentOnce();
      });

      obs.observe(successEl, {
        attributes: true,
        attributeFilter: ["style", "class", "hidden", "aria-hidden"]
      });

      // Keep trying briefly because Brevo may replace nodes during init
      var start = Date.now();
      var maxMs = 5000; // try for up to 5 seconds
      var interval = 50;
      var timer = null;

      function attempt() {
        var el = findField();
        var ok = setFieldValue(el, leadMagnet);

        // Stop if set, or after timeout
        if (ok || (Date.now() - start) > maxMs) {
          if (timer) clearInterval(timer);
          timer = null;
          return;
        }
      }

      // 1) Start immediately
      attempt();

      // 2) Poll for a short time (catches Brevo replacing inputs)
      timer = setInterval(attempt, interval);

      // 3) Also re-attempt when DOM changes (Brevo re-renders)
      var mo = new MutationObserver(function () { attempt(); });
      mo.observe(document.documentElement, { childList: true, subtree: true });

      // 4) Re-attempt when Brevo finishes loading its script (extra nudge)
      window.addEventListener("load", function () {
        setTimeout(attempt, 0);
        setTimeout(attempt, 150);
        setTimeout(attempt, 400);
        setTimeout(attempt, 900);
      });
    })();
  </script>

  <script>
    (function () {
      // Paste your n8n Webhook URL here later:
      // Example: https://n8n.yourdomain.com/webhook/brevo-brochure-submit
      var WEBHOOK_URL = "https://n8n2.ventureoutdoors.xyz/webhook/109e9c05-83e3-486f-ae5d-baab7a1ce82a";
  
      function safeStr(v) { return (v == null) ? "" : String(v).trim(); }
  
      function qs(name) {
        try { return safeStr(new URLSearchParams(location.search).get(name)); }
        catch (e) { return ""; }
      }
  
      function collectPayload(form) {
        var first = form.querySelector("#FIRSTNAME, input[name='FIRSTNAME']");
        var last  = form.querySelector("#LASTNAME, input[name='LASTNAME']");
        var email = form.querySelector("#EMAIL, input[name='EMAIL']");
  
        return {
          event: "brevo_form_submit",
          ts: new Date().toISOString(),
          page_url: safeStr(location.href),
          referrer: safeStr(document.referrer),
          form_action: safeStr(form.getAttribute("action") || ""),
          form_key: qs("form_key"),
          product_name: qs("product_name"),
          utm_source: qs("utm_source"),
          firstname: safeStr(first && first.value),
          lastname: safeStr(last && last.value),
          email: safeStr(email && email.value)
        };
      }
  
      function sendToN8n(payload) {
        if (!WEBHOOK_URL || WEBHOOK_URL === "N8N_WEBHOOK_URL_HERE") return;
  
        var body = JSON.stringify(payload);
  
        // Best effort: sendBeacon
        try {
          if (navigator.sendBeacon) {
            var blob = new Blob([body], { type: "text/plain;charset=UTF-8" });
            if (navigator.sendBeacon(WEBHOOK_URL, blob)) return;
          }
        } catch (e) {}
  
        // Fallback: fetch, fire-and-forget
        try {
          fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors",
            credentials: "omit",
            keepalive: true,
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: body
          }).catch(function () {});
        } catch (e) {}
      }
  
      // Capture phase ensures we read values BEFORE Brevo scripts mutate the DOM
      document.addEventListener("submit", function (e) {
        var form = e.target;
        if (!form || form.id !== "sib-form") return;
  
        sendToN8n(collectPayload(form));
      }, true);
    })();
  </script>
